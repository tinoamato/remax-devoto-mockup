<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("remax-devoto:tema");
          if (t === "claro" || t === "oscuro") {
            document.documentElement.setAttribute("data-theme", t === "oscuro" ? "dark" : "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
